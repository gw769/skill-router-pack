name: release-pack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test local router
        run: python3 -m unittest discover -s tests -v

      - name: Pull skills_index.json from Google Drive
        id: drive_pull
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$GDRIVE_CREDENTIALS" ] || [ -z "$GDRIVE_FOLDER_ID" ]; then
            echo "Drive pull skipped: credentials or folder ID missing."
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y rclone
          umask 077
          credential_file=$(mktemp)
          trap 'rm -f -- "$credential_file"' EXIT
          printf '%s' "$GDRIVE_CREDENTIALS" > "$credential_file"
          unset GDRIVE_CREDENTIALS
          rclone copy :drive:skills_index.json . \
            --drive-service-account-file "$credential_file" \
            --drive-root-folder-id "$GDRIVE_FOLDER_ID" \
            --drive-scope drive
          test -f skills_index.json
          python3 -c 'import json; x=json.load(open("skills_index.json")); assert isinstance(x,list) and x, "Expected nonempty index list"'
          echo "pulled=true" >> "$GITHUB_OUTPUT"
          echo "Pulled skills_index.json from Drive."

      - name: Zip pack
        run: |
          mkdir -p dist
          zip -r dist/skill-router-pack.zip README.md HOW_TO_LOAD.md grok use-installed-skills rules -x '*/__pycache__/*' '*.pyc'
          if [ -f skills_index.json ]; then
            zip -u dist/skill-router-pack.zip skills_index.json
          fi

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-router-pack
          path: dist/skill-router-pack.zip

      # Service accounts have no My Drive quota, so CI must UPDATE a user-owned
      # file (seeded once) instead of creating a new zip in the shared folder.
      - name: Upload zip to Google Drive
        id: drive_upload
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_ZIP_FILE_ID: ${{ secrets.GDRIVE_ZIP_FILE_ID }}
        run: |
          set -euo pipefail
          if [ -z "$GDRIVE_CREDENTIALS" ] || [ -z "$GDRIVE_ZIP_FILE_ID" ]; then
            echo "Drive upload skipped: credentials or target file ID missing."
            exit 0
          fi
          python3 -m venv /tmp/gdvenv
          /tmp/gdvenv/bin/pip install -q google-api-python-client google-auth
          umask 077
          credential_file=$(mktemp)
          trap 'rm -f -- "$credential_file"' EXIT
          printf '%s' "$GDRIVE_CREDENTIALS" > "$credential_file"
          unset GDRIVE_CREDENTIALS
          export GDRIVE_CREDENTIAL_FILE="$credential_file"
          /tmp/gdvenv/bin/python <<'PY'
          import os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          file_id = os.environ["GDRIVE_ZIP_FILE_ID"]
          creds = service_account.Credentials.from_service_account_file(
              os.environ["GDRIVE_CREDENTIAL_FILE"],
              scopes=["https://www.googleapis.com/auth/drive"],
          )
          service = build("drive", "v3", credentials=creds, cache_discovery=False)
          media = MediaFileUpload(
              "dist/skill-router-pack.zip",
              mimetype="application/zip",
              resumable=True,
          )
          updated = service.files().update(
              fileId=file_id,
              media_body=media,
              fields="id,name,size,modifiedTime",
              supportsAllDrives=True,
          ).execute()
          print(f"Updated Drive file {updated['id']} size={updated.get('size')} modified={updated.get('modifiedTime')}")
          PY
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
          echo "Uploaded skill-router-pack.zip to Drive file $GDRIVE_ZIP_FILE_ID"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIVE_UPLOADED: ${{ steps.drive_upload.outputs.uploaded }}
          DRIVE_PULLED: ${{ steps.drive_pull.outputs.pulled }}
        run: |
          TAG=v0.1.${{ github.run_number }}
          NOTES="Router pack. Drive index pulled: ${DRIVE_PULLED:-false}; existing Drive ZIP updated: ${DRIVE_UPLOADED:-false}."
          gh release create "$TAG" dist/skill-router-pack.zip --title "$TAG" --notes "$NOTES"
