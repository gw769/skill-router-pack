name: release-pack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip pack
        run: |
          mkdir -p dist
          zip -r dist/skill-router-pack.zip README.md HOW_TO_LOAD.md grok use-installed-skills rules
      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-router-pack
          path: dist/skill-router-pack.zip
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=v0.1.${{ github.run_number }}
          gh release create "$TAG" dist/skill-router-pack.zip --title "$TAG" --notes "Router pack for grok.com Custom Instructions. No Drive upload."
